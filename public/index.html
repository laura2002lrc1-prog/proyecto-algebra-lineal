<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Álgebra Lineal - Banco de Ejercicios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 30px; text-align: center; }
        h1 { color: var(--primary); margin-bottom: 10px; }
        .form-box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-box h3 { margin-bottom: 15px; color: var(--text); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .submit-btn:hover { background: #1d4ed8; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: 1px solid var(--border); background: var(--card); cursor: pointer; border-radius: 8px; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: relative; }
        .card h3 { margin-bottom: 10px; font-size: 1.2rem; color: var(--primary); padding-right: 20px; }
        .card p { color: var(--text-muted); margin-bottom: 15px; font-size: 0.95rem; white-space: pre-line; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .ans-btn { background: #f1f5f9; border: none; padding: 8px 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--text); transition: 0.2s; }
        .ans-btn:hover { background: #e2e8f0; }
        .respuesta { display: none; margin-top: 10px; padding: 10px; background: #f0fdf4; border-left: 4px solid var(--success); border-radius: 4px; font-size: 0.9rem; }
        .delete-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Álgebra Lineal • Banco de Ejercicios</h1>
            <p>Panel interactivo conectado a SQLite en la nube</p>
        </header>

        <!-- Formulario para agregar ejercicios -->
        <div class="form-box">
            <h3>Agregar Nuevo Ejercicio</h3>
            <form id="ejercicioForm">
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria" required>
                        <option value="VECTORES Y ESPACIOS">VECTORES Y ESPACIOS</option>
                        <option value="MATRICES Y SISTEMAS">MATRICES Y SISTEMAS</option>
                        <option value="TRANSFORMACIONES">TRANSFORMACIONES</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Título del Problema</label>
                    <input type="text" id="titulo" placeholder="Ej. Multiplicación de Matrices 2x2" required>
                </div>
                <div class="form-group">
                    <label>Enunciado / Desarrollo</label>
                    <textarea id="enunciado" rows="3" placeholder="Escribe las instrucciones o ecuaciones..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Respuesta Final (Solución)</label>
                    <input type="text" id="respuesta" placeholder="Resultado que verán los alumnos">
                </div>
                <button type="submit" class="submit-btn">Guardar en Base de Datos</button>
            </form>
        </div>

        <!-- Barra de Filtros por Categoría -->
        <div class="tabs">
            <button class="tab-btn active" onclick="filtrar('TODOS')">Todos los Ejercicios</button>
            <button class="tab-btn" onclick="filtrar('VECTORES Y ESPACIOS')">Vectores y Espacios</button>
            <button class="tab-btn" onclick="filtrar('MATRICES Y SISTEMAS')">Matrices y Sistemas</button>
            <button class="tab-btn" onclick="filtrar('TRANSFORMACIONES')">Transformaciones</button>
        </div>

        <!-- Rejilla donde se cargan las tarjetas -->
        <div class="grid" id="ejerciciosGrid"></div>
    </div>

    <script>
        let categoriaActual = 'TODOS';

        // Obtener datos del servidor SQLite
        async function obtenerEjercicios() {
            let url = '/api/ejercicios';
            if (categoriaActual !== 'TODOS') {
                url += `?categoria=${encodeURIComponent(categoriaActual)}`;
            }
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (json.ok) renderizar(json.data);
            } catch (err) {
                console.error("Error al conectar con la API:", err);
            }
        }

        // Renderizar las tarjetas dinámicamente
        function renderizar(lista) {
            const grid = document.getElementById('ejerciciosGrid');
            grid.innerHTML = lista.length === 0 ? '<p style="grid-column: 1/-1; text-align:center; color:gray; padding: 20px;">No hay ejercicios registrados en esta sección.</p>' : '';
            
            lista.forEach(ej => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="eliminar(${ej.id})">✕</button>
                    <span class="badge">${ej.categoria}</span>
                    <h3>${ej.titulo}</h3>
                    <p>${ej.enunciado}</p>
                    <button class="ans-btn" onclick="toggleAns(${ej.id})">Ver Solución</button>
                    <div class="respuesta" id="ans-${ej.id}">${ej.respuesta || 'Procedimiento no disponible.'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleAns(id) {
            const div = document.getElementById(`ans-${id}`);
            div.style.display = div.style.display === 'block' ? 'none' : 'block';
        }

        // Lógica de filtrado por categoría corregida
        function filtrar(cat) {
            categoriaActual = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${cat}'`)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            obtenerEjercicios();
        }

        // Eliminar registros
        async function eliminar(id) {
            if(!confirm("¿Deseas eliminar este ejercicio del repositorio?")) return;
            try {
                const res = await fetch(`/api/ejercicios/${id}`, { method: 'DELETE' });
                const json = await res.json();
                if(json.ok) obtenerEjercicios();
            } catch (err) {
                console.error("Error al borrar:", err);
            }
        }

        // Enviar nuevo ejercicio al backend
        document.getElementById('ejercicioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                categoria: document.getElementById('categoria').value,
                titulo: document.getElementById('titulo').value,
                enunciado: document.getElementById('enunciado').value,
                respuesta: document.getElementById('respuesta').value
            };
            try {
                const res = await fetch('/api/ejercicios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const json = await res.json();
                if(json.ok) {
                    document.getElementById('ejercicioForm').reset();
                    obtenerEjercicios();
                }
            } catch (err) {
                console.error("Error al guardar:", err);
            }
        });

        document.addEventListener('DOMContentLoaded', obtenerEjercicios);
    </script>
</body>
</html>
